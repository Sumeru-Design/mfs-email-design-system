<!DOCTYPE html>
<html lang="en" data-theme="light" data-view="web" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MyFreeStyle Email Design System</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/BrandonText-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BrandonText-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="site.css">
  <script>
    // Site chrome follows the system colour scheme. Module previews have their own
    // Light/Dark + Web/Mobile settings (Modules tab), restored before first paint.
    (function (d) {
      if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) d.dataset.theme = 'dark';
      try {
        var sc = localStorage.getItem('mfs-scheme'), v = localStorage.getItem('mfs-view');
        if (sc === 'dark' || sc === 'light') d.dataset.scheme = sc;
        if (v === 'web' || v === 'mobile') d.dataset.view = v;
      } catch (e) {}
    })(document.documentElement);
  </script>
</head>
<body>
  <!-- Password screen (visibility gate only; files remain public on GitHub) -->
  <div class="gate" id="gate" hidden>
    <form class="gate__card" id="gate-form" autocomplete="off">
      <img class="gate__logo" src="assets/brand/logo-mfs-dark.svg" alt="MyFreeStyle" width="200" height="51">
      <h1 class="gate__title">Email Design System</h1>
      <p class="gate__text">Enter the password to continue.</p>
      <label class="visually-hidden" for="gate-pw">Password</label>
      <input class="gate__input" id="gate-pw" type="password" placeholder="Password" required autofocus>
      <button class="gate__btn" type="submit">Unlock</button>
      <p class="gate__error" id="gate-error" role="alert" hidden>That password isn’t right. Try again.</p>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/brand/overview" aria-label="Email Design System home">
        <img class="brand__logo brand__logo--light" src="assets/brand/logo-mfs-white.svg" alt="MyFreeStyle" width="132" height="34">
        <img class="brand__logo brand__logo--dark" src="assets/brand/logo-mfs-dark.svg" alt="MyFreeStyle" width="132" height="34">
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__name">Email Design System</span>
      </a>
      <span class="pill" id="version-pill"></span>
      <nav class="tabs" aria-label="Sections">
        <a class="tabs__link" data-tab-link="brand" href="#/brand/overview">Brand Library</a>
        <a class="tabs__link" data-tab-link="modules" href="#/modules/header">Modules</a>
      </nav>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Design system">
        <div class="sidebar__search">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <label class="visually-hidden" for="nav-filter">Filter</label>
          <input id="nav-filter" type="search" placeholder="Search…" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <div class="sidebar__scroll" id="nav"></div>
      </nav>
      <div class="scrim" id="scrim" hidden></div>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="site.js"></script>
</body>
</html>
